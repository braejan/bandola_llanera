services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: bandola-llanera:latest
    container_name: bandola_llanera
    ports:
      - "1530:4173"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4173/historia/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
